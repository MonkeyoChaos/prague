<style>
  :root{
    --app:#E9ECEE; --surface:#fff; --ink:#16202B; --inkSoft:#5A6774; --line:#DBE0E4;
    --primary:#0F6E6A; --primarySoft:#E2F0EE; --done:#2E7D5B; --doneTint:#EEF6F1;
    --brass:#9A6A14; --brassSoft:#F5EEDD; --danger:#B23A25;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--app);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:16px}
  a{color:inherit}
  .mono{font-family:var(--mono)}

  header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
    padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
  .eyebrow{font-family:var(--mono);color:var(--primary);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
  .tripname{display:flex;align-items:center;gap:4px;max-width:100%}
  .tripname h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-family:var(--mono);color:var(--inkSoft);font-size:12px;margin-top:3px}
  .iconbtn{color:var(--inkSoft);padding:8px;border-radius:8px}
  .row{display:flex;align-items:center}
  .between{justify-content:space-between}

  .switch{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .switch .item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .switch .item:last-child{border-bottom:none}
  .switch .pick{flex:1;text-align:left;padding:12px 14px;min-width:0}
  .switch .pick .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .switch .new{width:100%;display:flex;align-items:center;gap:8px;padding:12px 14px;color:var(--primary);font-weight:600}

  .tabs{overflow-x:auto;padding:12px 12px 6px}
  .tabs .inner{display:flex;gap:8px;width:max-content}
  .tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .tab .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
  .tab.active .lbl{opacity:.85}
  .tab .cnt{font-family:var(--mono);font-size:12px;font-weight:700}
  .tab.add{border-style:dashed;color:var(--inkSoft);display:flex;align-items:center}

  .dayhead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
  .dayhead .t{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800}
  .dayhead .del{color:var(--inkSoft);font-size:12px;display:flex;align-items:center;gap:4px}

  .body{padding:12px 12px 120px}

  /* map */
  .maproute{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  #map{height:200px;width:100%;background:#dfe4e7}
  .maproute .mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .maproute .mbar .lab{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--inkSoft)}

<body>
<div class="wrap" id="app"></div>
<button id="installBtn" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;background:#0F6E6A;color:#fff;font-weight:600;border-radius:999px;padding:11px 18px;box-shadow:0 6px 18px rgba(22,32,43,.25);font-family:var(--sans)">⬇ Install app</button>
<div id="iosHint" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;max-width:436px;margin:0 auto;background:#16202B;color:#fff;border-radius:12px;padding:12px 14px;font-family:var(--sans);font-size:13px;line-height:1.35">Install: tap the <b>Share</b> icon, then <b>Add to Home Screen</b>. <button id="iosX" style="float:right;color:#9fb0bd;font-weight:700">✕</button></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ============================ data ============================ */
var KEY="trip_itineraries_v1";
var CATS={
  landmark:{label:"Landmark",emoji:"🏛️",color:"#0F6E6A",tint:"#E2F0EE"},
  art:{label:"Art / Museum",emoji:"🖼️",color:"#6D4AA3",tint:"#EEE9F6"},
  food:{label:"Food / Drink",emoji:"🍽️",color:"#9A6A14",tint:"#F5EEDD"},
  park:{label:"Park / Garden",emoji:"🌳",color:"#3F7D3A",tint:"#E9F2E6"},
  church:{label:"Church",emoji:"⛪",color:"#7A6A55",tint:"#EFEBE3"},
  view:{label:"View / Tower",emoji:"🗼",color:"#2F6DAA",tint:"#E7EFF7"},
  daytrip:{label:"Day trip",emoji:"🚆",color:"#C25A3A",tint:"#F7E9E3"}
};
var CAT_KEYS=Object.keys(CATS);

function uid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(36).slice(2);}
function deriveCat(t,q){
  var s=((t||"")+" "+(q||"")).toLowerCase();
  if(q&&q.indexOf(",")>-1)return"daytrip";
  if(/(café|cafe|dinner|lunch|lokál|lokal|pivovar|restaurant|market|beer|coffee|savoy|brunch|bar\b)/.test(s))return"food";
  if(/(museum|gallery|galer|mucha|dox|kampa|veletržní|veletrzni|communism|\bart\b)/.test(s))return"art";
  if(/(garden|zahrada|sady|park|petřín|petrin|grébovka|grebovka|hill)/.test(s))return"park";
  if(/(church|bazilika|cathedral|katedrála|synagog|ossuary|monastery|klášter|klaster|rotunda)/.test(s))return"church";
  if(/(tower|věž|\bvez\b|rozhledna|lookout|\bview|dancing house|tančící)/.test(s))return"view";
  return"landmark";
}

function seedPrague(){
  function D(label,arr){return {id:uid(),label:label,notes:"",stops:arr.map(function(s){
    return {id:uid(),title:s.t,note:s.n||"",query:s.q||s.t,wiki:s.w||(s.q||s.t),cat:deriveCat(s.t,s.q),img:"",lat:null,lng:null,done:false};
  })};}
  return {id:uid(),name:"Prague",region:"Praha, Czechia",days:[
    D("Day 1",[
      {t:"Old Town Square + Astronomical Clock",n:"Orloj show on the hour; heart of the old city",q:"Staroměstské náměstí",w:"Old Town Square Prague"},
      {t:"Old Town Hall Tower",n:"Climb for the best rooftop view over the square",q:"Old Town Hall Tower Prague",w:"Old Town Hall Prague"},
      {t:"Church of St. James the Greater",n:"Baroque interior + the 400-yr-old thief's arm",q:"Bazilika svatého Jakuba Většího Praha",w:"Church of St James Prague"},
      {t:"The Idiom (book tower)",n:"Infinite mirrored book tower in the library — free",q:"Městská knihovna v Praze",w:"Municipal Library of Prague"},
      {t:"Josefov — Jewish Quarter",n:"Combined ticket; some sights close on Jewish holidays ~Sep 26–27",q:"Spanish Synagogue Prague",w:"Spanish Synagogue Prague"},
      {t:"Municipal House + Powder Tower",n:"Art Nouveau landmark beside the Gothic gate",q:"Obecní dům Praha",w:"Municipal House Prague"},
      {t:"Dinner — Lokál Dlouhááá",n:"Tank Pilsner + Czech pub classics",q:"Lokál Dlouhá",w:"Lokál Dlouhá Prague restaurant"}
    ]),
    D("Day 2",[
      {t:"Prague Castle",n:"St. Vitus, Old Royal Palace, Golden Lane",q:"Pražský hrad",w:"Prague Castle"},
      {t:"Strahov Monastery Library",n:"The jaw-dropping Baroque library halls",q:"Strahovský klášter",w:"Strahov Monastery"},
      {t:"Nový Svět lane",n:"Quiet historic street behind the castle",q:"Nový Svět Praha",w:"Nový Svět Prague"},
      {t:"Petřín Lookout Tower",n:"Funicular up, gardens, mini-Eiffel views",q:"Petřínská rozhledna",w:"Petřín Lookout Tower"},
      {t:"Café Savoy",n:"Grand café — superb breakfast/brunch",q:"Café Savoy Praha",w:"Café Savoy Prague"}
    ]),
    D("Day 3",[
      {t:"Charles Bridge",n:"Go early or at golden hour",q:"Karlův most",w:"Charles Bridge"},
      {t:"Lennon Wall",n:"Ever-changing mural in Malá Strana",q:"Lennonova zeď",w:"Lennon Wall Prague"},
      {t:"Museum Kampa",n:"Modern Czech art on the riverbank",q:"Museum Kampa",w:"Museum Kampa"},
      {t:"Wallenstein Garden",n:"Free Baroque garden, peacocks, dripstone wall",q:"Valdštejnská zahrada",w:"Wallenstein Palace Prague"},
      {t:"Vrtba Garden",n:"Terraced Baroque garden with city views",q:"Vrtbovská zahrada",w:"Vrtba Garden"},
      {t:"Franz Kafka rotating head",n:"Černý's mirrored kinetic sculpture",q:"Hlava Franze Kafky",w:"Head of Franz Kafka"},
      {t:"Náplavka riverfront",n:"Evening beer & wine along the embankment",q:"Náplavka Praha",w:"Náplavka Prague riverfront"}
    ]),
    D("Day 4",[
      {t:"National Gallery — Veletržní Palác",n:"Modern/contemporary; Mucha's Slav Epic",q:"Veletržní palác",w:"Veletržní Palác"},
      {t:"Mucha Museum",n:"Alfons Mucha's Art Nouveau, small and focused",q:"Mucha Museum Prague",w:"Mucha Museum"},
      {t:"Museum of Communism",n:"Substantive Soviet-era history",q:"Museum of Communism Prague",w:"Museum of Communism Prague"},
      {t:"Žižkov TV Tower",n:"Černý's crawling babies + panorama deck",q:"Žižkovská věž",w:"Žižkov Television Tower"},
      {t:"DOX Centre for Contemporary Art",n:"Edgy contemporary space in Holešovice",q:"DOX Praha",w:"DOX Centre for Contemporary Art"}
    ]),
    D("Day 5",[
      {t:"Sedlec Ossuary (bone church)",n:"Day trip — ~1 hr by train",q:"Sedlec Ossuary, Kutná Hora",w:"Sedlec Ossuary"},
      {t:"Cathedral of St. Barbara",n:"Gothic masterpiece in Kutná Hora",q:"Cathedral of St. Barbara, Kutná Hora",w:"St Barbara's Church Kutná Hora"}
    ]),
    D("Day 6",[
      {t:"Vyšehrad",n:"Fortress, casemates, cemetery (Dvořák, Smetana), rotunda",q:"Vyšehrad",w:"Vyšehrad"},
      {t:"Havlíčkovy sady (Grébovka)",n:"Park + Grotto folly; wine-harvest festival late Sept",q:"Havlíčkovy sady Grébovka",w:"Havlíčkovy sady"},
      {t:"Paternoster elevator — Lucerna",n:"Doorless continuous loop elevator — free & weird",q:"Palác Lucerna Praha",w:"Lucerna Palace"},
      {t:"Náplavka Farmers' Market",n:"Saturdays — autumn produce & Czech wines",q:"Náplavka Farmers Market Rašínovo nábřeží",w:"Náplavka Prague"},
      {t:"Dinner — Vinohradský pivovar",n:"Local microbrewery in Vinohrady",q:"Vinohradský pivovar",w:"Vinohradský pivovar Prague"}
    ]),
    D("Day 7",[
      {t:"Karlštejn Castle",n:"Optional day trip — hilltop castle, ~40 min train",q:"Karlštejn Castle, Karlštejn",w:"Karlštejn Castle"},
      {t:"Cold War nuclear bunker tour",n:"20th-c. history — book ahead",q:"Nuclear Bunker Parukářka Praha",w:"Bunker Parukářka Prague"},
      {t:"Dancing House rooftop",n:"Gehry landmark; drink with a view",q:"Tančící dům",w:"Dancing House"},
      {t:"Flex / buffer",n:"Catch anything pushed forward from earlier days",q:"Prague",w:""}
    ])
  ]};
}

/* ============================ state ============================ */
var state={trips:[],activeId:null};
var ui={dayIdx:0,mode:"stops",switcher:false,modal:null,notesOpen:false};

function normalize(trips){
  return (trips||[]).map(function(t){
    return {id:t.id||uid(),name:t.name||"Untitled trip",region:t.region||"",
      days:(t.days||[]).map(function(d){
        return {id:d.id||uid(),label:d.label||"Day",notes:d.notes||"",
          stops:(d.stops||[]).map(function(s){
            return {id:s.id||uid(),title:s.title||"Untitled",note:s.note||"",query:s.query||s.title||"",
              wiki:s.wiki||s.query||s.title||"",cat:s.cat||deriveCat(s.title,s.query),
              img:s.img||"",lat:(s.lat===0||s.lat)?s.lat:null,lng:(s.lng===0||s.lng)?s.lng:null,
              done:!!s.done};
          })};
      })};
  });
}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);
    if(d&&d.trips&&d.trips.length){state.trips=normalize(d.trips);
      state.activeId=d.trips.some(function(t){return t.id===d.activeId})?d.activeId:state.trips[0].id;return;}}
  }catch(e){}
  state.trips=normalize([seedPrague()]);state.activeId=state.trips[0].id;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function trip(){for(var i=0;i<state.trips.length;i++)if(state.trips[i].id===state.activeId)return state.trips[i];return null;}
function day(){var t=trip();if(!t)return null;if(ui.dayIdx>t.days.length-1)ui.dayIdx=Math.max(0,t.days.length-1);return t.days[ui.dayIdx];}

/* ============================ maps links ============================ */
function fq(q,region){return (q&&q.indexOf(",")>-1)?q:[q,region].filter(Boolean).join(", ");}
function dirUrl(q,region){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(fq(q,region));}
function legUrl(a,b,region){return "https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+encodeURIComponent(fq(a.query,region))+"&destination="+encodeURIComponent(fq(b.query,region));}
function routeUrl(stops,region){
  var pts=stops.map(function(s){return fq(s.query,region);}).filter(Boolean);
  if(!pts.length)return null;
  if(pts.length===1)return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(pts[0]);
  var origin=pts[0],dest=pts[pts.length-1],way=pts.slice(1,-1);
  var u="https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+encodeURIComponent(origin)+"&destination="+encodeURIComponent(dest);
  if(way.length)u+="&waypoints="+way.map(encodeURIComponent).join("%7C");
  return u;
}

/* ============================ enrichment (photos + coords) ============================ */
var geoQueue=[],geoBusy=false;
function enrich(){
  var t=trip();if(!t)return;
  var stops=[];t.days.forEach(function(d){d.stops.forEach(function(s){stops.push(s);});});
  stops.forEach(function(s){
    if(s._wikiTried||(s.img&&s.lat!=null))return;
    s._wikiTried=true;
    if(!s.wiki){maybeGeo(s);return;}
    var url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(s.wiki)+"&prop=pageimages|coordinates&piprop=thumbnail&pithumbsize=500";
    fetch(url).then(function(r){return r.json();}).then(function(j){
      var pages=j&&j.query&&j.query.pages;var changed=false;
      if(pages){var p=pages[Object.keys(pages)[0]];
        if(p&&p.thumbnail&&p.thumbnail.source&&!s.img){s.img=p.thumbnail.source;changed=true;}
        if(p&&p.coordinates&&p.coordinates[0]&&s.lat==null){s.lat=p.coordinates[0].lat;s.lng=p.coordinates[0].lon;changed=true;}
      }
      if(changed){save();softRefresh();}
      if(s.lat==null)maybeGeo(s);
    }).catch(function(){maybeGeo(s);});
  });
}
function maybeGeo(s){
  if(s.lat!=null||s._geoTried)return;s._geoTried=true;
  geoQueue.push(s);pumpGeo();
}
function pumpGeo(){
  if(geoBusy||!geoQueue.length)return;geoBusy=true;
  var s=geoQueue.shift();var t=trip();var q=fq(s.query,t?t.region:"");
  var url="https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q);
  fetch(url,{headers:{Accept:"application/json"}}).then(function(r){return r.json();}).then(function(j){
    if(j&&j[0]){s.lat=parseFloat(j[0].lat);s.lng=parseFloat(j[0].lon);save();softRefresh();}
  }).catch(function(){}).then(function(){
    setTimeout(function(){geoBusy=false;pumpGeo();},1100);
  });
}

/* ============================ Leaflet map ============================ */
var map=null,markerLayer=null,tilesOk=false;
function ensureMap(){
  if(map)return;
  try{
    map=L.map("map",{zoomControl:true,attributionControl:true,scrollWheelZoom:false});
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
    tilesOk=true;markerLayer=L.layerGroup().addTo(map);
    map.setView([50.087,14.42],12);
  }catch(e){map=null;}
}
function updateMap(){
  if(!window.L){return;}
  ensureMap();if(!map)return;
  markerLayer.clearLayers();
  var d=day();if(!d){return;}
  var t=trip();
  var pts=[],latlngs=[];
  d.stops.forEach(function(s,i){
    if(s.lat==null||s.lng==null)return;
    var ll=[s.lat,s.lng];latlngs.push(ll);pts.push(ll);
    var num=i+1;
    var icon=L.divIcon({className:"",html:'<div class="pin"><span>'+num+'</span></div>',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]});
    var m=L.marker(ll,{icon:icon}).addTo(markerLayer);
    var pop='<b>'+num+". "+escapeHtml(s.title)+'</b><br><a href="'+dirUrl(s.query,t.region)+'" target="_blank" rel="noopener">Directions ↗</a>';
    m.bindPopup(pop);
  });
  if(latlngs.length>1){L.polyline(latlngs,{color:"#0F6E6A",weight:3,opacity:.7,dashArray:"1 8",lineCap:"round"}).addTo(markerLayer);}
  if(pts.length){try{map.fitBounds(L.latLngBounds(pts).pad(0.25),{maxZoom:15});}catch(e){}}
  setTimeout(function(){try{map.invalidateSize();}catch(e){}},60);
}

/* ============================ rendering ============================ */
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}

function render(){
  var app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(renderHeader());
  var t=trip();
  if(!t){app.appendChild(el('<div class="empty" style="padding-top:60px">No trips yet.<br><br></div>'));
    var b=el('<button class="btn-primary" style="margin:0 auto">+ Create a trip</button>');
    b.onclick=function(){ui.modal={mode:"new",name:"",region:"",days:5};render();};
    app.lastChild.appendChild(b);return;}
  app.appendChild(renderTabs(t));
  app.appendChild(renderDayHead());
  var body=el('<div class="body" id="body"></div>');
  app.appendChild(body);
  renderBody();
  if(ui.modal)app.appendChild(renderModal());
}

function renderHeader(){
  var t=trip();
  var done=0,total=0;
  if(t)t.days.forEach(function(d){d.stops.forEach(function(s){total++;if(s.done)done++;});});
  var h=el('<header></header>');
  var top=el('<div class="row between" style="align-items:flex-start"></div>');
  var left=el('<div style="min-width:0"><div class="eyebrow">Itinerary</div></div>');
  var nameBtn=el('<button class="tripname"><h1>'+escapeHtml(t?t.name:"No trip")+'</h1><span style="color:var(--inkSoft)">▾</span></button>');
  nameBtn.onclick=function(){ui.switcher=!ui.switcher;render();};
  left.appendChild(nameBtn);
  if(t)left.appendChild(el('<div class="sub">'+t.days.length+' days · '+done+'/'+total+' done</div>'));
  top.appendChild(left);
  if(t){var edit=el('<button class="iconbtn" aria-label="Edit trip">✎</button>');
    edit.onclick=function(){ui.modal={mode:"edit",name:t.name,region:t.region};render();};top.appendChild(edit);}
  h.appendChild(top);
  if(ui.switcher)h.appendChild(renderSwitcher());
  return h;
}
function renderSwitcher(){
  var box=el('<div class="switch"></div>');
  state.trips.forEach(function(t){
    var item=el('<div class="item"'+(t.id===state.activeId?' style="background:var(--primarySoft)"':'')+'></div>');
    var pick=el('<button class="pick"><div class="n">'+escapeHtml(t.name)+'</div><div class="mono" style="font-size:12px;color:var(--inkSoft)">'+t.days.length+' days</div></button>');
    pick.onclick=function(){state.activeId=t.id;ui.dayIdx=0;ui.mode="stops";ui.switcher=false;save();render();updateMap();enrich();};
    var del=el('<button style="padding:12px;color:var(--danger)">🗑</button>');
    del.onclick=function(){deleteTrip(t.id);};
    item.appendChild(pick);item.appendChild(del);box.appendChild(item);
  });
  var nw=el('<button class="new">＋ New trip</button>');
  nw.onclick=function(){ui.switcher=false;ui.modal={mode:"new",name:"",region:"",days:5};render();};
  box.appendChild(nw);return box;
}
function renderTabs(t){
  var tabs=el('<div class="tabs"></div>');var inner=el('<div class="inner"></div>');
  t.days.forEach(function(d,i){
    var dn=d.stops.filter(function(s){return s.done;}).length;
    var tab=el('<button class="tab'+(i===ui.dayIdx?' active':'')+'"><div class="lbl">'+escapeHtml(d.label)+'</div><div class="cnt">'+dn+'/'+d.stops.length+'</div></button>');
    tab.onclick=function(){ui.dayIdx=i;save();render();updateMap();};
    inner.appendChild(tab);
  });
  var add=el('<button class="tab add">＋</button>');
  add.onclick=function(){addDay();};inner.appendChild(add);
  tabs.appendChild(inner);return tabs;
}
function renderDayHead(){
  var d=day();var t=trip();
  var head=el('<div class="dayhead"></div>');
  var title=el('<button class="t">🗓 '+escapeHtml(d.label)+' <span style="color:var(--inkSoft);font-size:12px">✎</span></button>');
  title.onclick=function(){
    var nv=prompt("Rename day",d.label);if(nv!=null&&nv.trim()){d.label=nv.trim();save();render();}
  };
  head.appendChild(title);
  if(t.days.length>1){var del=el('<button class="del">🗑 Day</button>');
    del.onclick=function(){deleteDay(ui.dayIdx);};head.appendChild(del);}
  return head;
}

function renderBody(){
  var body=document.getElementById("body");if(!body)return;
  body.innerHTML="";
  body.appendChild(renderMapCard());
  var seg=el('<div class="seg"></div>');
  [["stops","▤ Stops"],["route","➟ Route"]].forEach(function(p){
    var b=el('<button class="'+(ui.mode===p[0]?"on":"")+'">'+p[1]+'</button>');
    b.onclick=function(){ui.mode=p[0];renderBody();updateMap();};seg.appendChild(b);
  });
  body.appendChild(seg);
  if(ui.mode==="stops"){body.appendChild(renderNotes());body.appendChild(renderStops());body.appendChild(renderAdd());}
  else body.appendChild(renderRoute());
}

function renderMapCard(){
  var d=day();var t=trip();
  var wrap=el('<div class="maproute"></div>');
  wrap.appendChild(el('<div id="map"></div>'));
  var bar=el('<div class="mbar"></div>');
  var located=d.stops.filter(function(s){return s.lat!=null;}).length;
  bar.appendChild(el('<div class="lab">'+located+'/'+d.stops.length+' stops mapped</div>'));
  var ru=routeUrl(d.stops,t.region);
  if(ru){var a=el('<a class="btn-primary" target="_blank" rel="noopener">➟ Open route in Maps</a>');a.href=ru;bar.appendChild(a);}
  wrap.appendChild(bar);
  wrap.appendChild(el('<div class="mapnote">Overview of the day\u2019s stops &amp; walking order. Tap a pin for directions. Live turn-by-turn opens in Google Maps.</div>'));
  return wrap;
}

function renderNotes(){
  var d=day();
  var box=el('<div style="margin-bottom:12px"></div>');
  var tgl=el('<button class="notes-toggle">🗒 Day notes'+((d.notes&&!ui.notesOpen)?" ·":"")+'</button>');
  tgl.onclick=function(){ui.notesOpen=!ui.notesOpen;renderBody();};
  box.appendChild(tgl);
  if(ui.notesOpen||d.notes){
    var ta=el('<textarea class="notes" rows="2" placeholder="Reservations, tickets booked, meeting times, reminders…"></textarea>');
    ta.value=d.notes;ta.oninput=function(){d.notes=ta.value;save();};
    if(!ui.notesOpen&&!d.notes){}else box.appendChild(ta);
  }
  return box;
}

function renderStops(){
  var d=day();var t=trip();
  var list=el('<div id="stoplist"></div>');
  if(!d.stops.length)list.appendChild(el('<div class="empty">Nothing here yet. Add your first stop below.</div>'));
  d.stops.forEach(function(s){list.appendChild(renderCard(s,d,t));});
  enableDrag(list,d);
  return list;
}

function renderCard(s,d,t){
  var cat=CATS[s.cat]||CATS.landmark;
  var card=el('<div class="card'+(s.done?" done":"")+'" data-id="'+s.id+'"></div>');
  var top=el('<div class="top"></div>');
  var grip=el('<button class="grip" aria-label="Drag">⠿</button>');
  var check=el('<button class="check'+(s.done?" on":"")+'">'+(s.done?'<span style="color:#fff;font-weight:900">✓</span>':'')+'</button>');
  check.onclick=function(){s.done=!s.done;save();render();updateMap();};
  var thumb=el('<div class="thumb'+((!s.img)?" loading":"")+'"></div>');
  thumb.appendChild(el('<div class="tile" style="background:'+cat.tint+'">'+cat.emoji+'</div>'));
  if(s.img){var img=document.createElement("img");img.src=s.img;img.alt="";img.loading="lazy";
    img.onerror=function(){this.style.display="none";};thumb.classList.remove("loading");thumb.appendChild(img);}
  var meat=el('<div class="meat"></div>');
  meat.appendChild(el('<div class="title">'+escapeHtml(s.title)+'</div>'));
  if(s.note)meat.appendChild(el('<div class="blurb">'+escapeHtml(s.note)+'</div>'));
  var acts=el('<div class="acts"></div>');
  var dir=el('<a class="dir" target="_blank" rel="noopener">➤ Directions</a>');dir.href=dirUrl(s.query,t.region);
  var move=el('<button class="move">→ Move</button>');
  var mini=el('<div class="mini"></div>');
  var edit=el('<button aria-label="Edit">✎</button>');edit.onclick=function(){openEdit(card,s,d,t);};
  var trash=el('<button class="trash" aria-label="Delete">🗑</button>');
  trash.onclick=function(){var i=d.stops.indexOf(s);if(i>-1){d.stops.splice(i,1);save();render();updateMap();}};
  mini.appendChild(edit);mini.appendChild(trash);
  acts.appendChild(dir);acts.appendChild(move);acts.appendChild(mini);
  meat.appendChild(acts);
  var movebar=el('<div class="movebar" style="display:none"></div>');
  trip().days.forEach(function(dd,i){
    if(dd===d)return;
    var b=el('<button>'+escapeHtml(dd.label)+'</button>');
    b.onclick=function(){var idx=d.stops.indexOf(s);if(idx>-1){d.stops.splice(idx,1);dd.stops.push(s);save();render();updateMap();}};
    movebar.appendChild(b);
  });
  move.onclick=function(){movebar.style.display=movebar.style.display==="none"?"flex":"none";};
  meat.appendChild(movebar);
  top.appendChild(grip);top.appendChild(check);top.appendChild(thumb);top.appendChild(meat);
  card.appendChild(top);
  card._grip=grip;card._stop=s;
  return card;
}

function editFields(s){
  return '<input class="field ef-title" placeholder="Name" value="'+escapeHtml(s.title)+'">'
    +'<input class="field ef-note" placeholder="Blurb / note (optional)" value="'+escapeHtml(s.note)+'">'
    +'<input class="field small ef-query" placeholder="Map search (defaults to name)" value="'+escapeHtml(s.query)+'">'
    +'<input class="field small ef-img" placeholder="Photo URL (optional — auto-fetched if blank)" value="'+escapeHtml(s.img)+'">';
}
function catPicker(sel){
  var wrap=el('<div class="catrow"></div>');
  CAT_KEYS.forEach(function(k){
    var c=CATS[k],on=sel===k;
    var b=el('<button data-k="'+k+'" style="background:'+(on?c.color:c.tint)+';color:'+(on?"#fff":c.color)+'">'+c.emoji+' '+c.label+'</button>');
    b.onclick=function(){wrap.querySelectorAll("button").forEach(function(x){var kk=x.getAttribute("data-k");var cc=CATS[kk];x.style.background=cc.tint;x.style.color=cc.color;});b.style.background=c.color;b.style.color="#fff";wrap._sel=k;};
    wrap.appendChild(b);
  });
  wrap._sel=sel;return wrap;
}
function openEdit(card,s,d,t){
  card.innerHTML="";
  card.appendChild(el(editFields(s)));
  var cp=catPicker(s.cat);card.appendChild(cp);
  var rowB=el('<div class="row" style="gap:8px;margin-top:12px"></div>');
  var saveB=el('<button class="save">Save</button>');
  var cancelB=el('<button class="cancel">Cancel</button>');
  saveB.onclick=function(){
    var title=card.querySelector(".ef-title").value.trim()||s.title;
    var note=card.querySelector(".ef-note").value.trim();
    var query=card.querySelector(".ef-query").value.trim()||title;
    var img=card.querySelector(".ef-img").value.trim();
    var newImg=(img!==s.img);
    s.title=title;s.note=note;s.query=query;s.cat=cp._sel;s.img=img;s.wiki=query;
    if(newImg||query){s._wikiTried=img?true:false;s._geoTried=false;}
    save();render();updateMap();enrich();
  };
  cancelB.onclick=function(){render();};
  rowB.appendChild(saveB);rowB.appendChild(cancelB);card.appendChild(rowB);
}

function renderAdd(){
  var d=day();
  var holder=el('<div></div>');
  var btn=el('<button class="addbtn">＋ Add a stop</button>');
  btn.onclick=function(){
    holder.innerHTML="";
    var box=el('<div class="card" style="border-color:var(--primary)"></div>');
    box.appendChild(el(editFields({title:"",note:"",query:"",img:""})));
    var cp=catPicker("landmark");box.appendChild(cp);
    var row=el('<div class="row" style="gap:8px;margin-top:12px"></div>');
    var add=el('<button class="save">Add stop</button>');
    var cancel=el('<button class="cancel">Cancel</button>');
    add.onclick=function(){
      var title=box.querySelector(".ef-title").value.trim();if(!title)return;
      var note=box.querySelector(".ef-note").value.trim();
      var query=box.querySelector(".ef-query").value.trim()||title;
      var img=box.querySelector(".ef-img").value.trim();
      d.stops.push({id:uid(),title:title,note:note,query:query,wiki:query,cat:cp._sel,img:img,lat:null,lng:null,done:false,_wikiTried:img?true:false});
      save();render();updateMap();enrich();
    };
    cancel.onclick=function(){render();};
    row.appendChild(add);row.appendChild(cancel);box.appendChild(row);holder.appendChild(box);
    box.querySelector(".ef-title").focus();
  };
  holder.appendChild(btn);return holder;
}

function renderRoute(){
  var d=day();var t=trip();
  var wrap=el('<div></div>');
  if(!d.stops.length){wrap.appendChild(el('<div class="empty">Add stops to build a route.</div>'));return wrap;}
  d.stops.forEach(function(s,i){
    var cat=CATS[s.cat]||CATS.landmark;
    var leg=el('<div class="leg"></div>');
    if(i<d.stops.length-1)leg.appendChild(el('<div class="line"></div>'));
    leg.appendChild(el('<div class="num" style="background:'+cat.color+'">'+(i+1)+'</div>'));
    var rc=el('<div class="rc"></div>');
    rc.appendChild(el('<div class="title" style="'+(s.done?"text-decoration:line-through;color:var(--inkSoft)":"")+'">'+escapeHtml(s.title)+'</div>'));
    if(s.note)rc.appendChild(el('<div class="blurb">'+escapeHtml(s.note)+'</div>'));
    var acts=el('<div class="acts" style="margin-top:8px"></div>');
    if(i>0){var walk=el('<a class="walk" target="_blank" rel="noopener">→ Walk from #'+i+'</a>');walk.href=legUrl(d.stops[i-1],s,t.region);acts.appendChild(walk);}
    var dh=el('<a class="walk" style="border-color:transparent" target="_blank" rel="noopener">➤ Directions here</a>');dh.href=dirUrl(s.query,t.region);acts.appendChild(dh);
    rc.appendChild(acts);leg.appendChild(rc);wrap.appendChild(leg);
  });
  return wrap;
}

/* ============================ drag reorder ============================ */
function enableDrag(list,d){
  var dragEl=null;
  list.querySelectorAll(".card").forEach(function(card){
    var grip=card._grip;if(!grip)return;
    grip.addEventListener("pointerdown",function(e){
      e.preventDefault();dragEl=card;card.classList.add("dragging");
      try{grip.setPointerCapture(e.pointerId);}catch(_){}
    });
    grip.addEventListener("pointermove",function(e){
      if(!dragEl)return;e.preventDefault();
      var y=e.clientY;var cards=Array.prototype.slice.call(list.querySelectorAll(".card"));
      var after=null;
      for(var i=0;i<cards.length;i++){if(cards[i]===dragEl)continue;
        var r=cards[i].getBoundingClientRect();
        if(y<r.top+r.height/2){after=cards[i];break;}}
      if(after)list.insertBefore(dragEl,after);else list.appendChild(dragEl);
    });
    function end(){
      if(!dragEl)return;dragEl.classList.remove("dragging");dragEl=null;
      var ids=Array.prototype.slice.call(list.querySelectorAll(".card")).map(function(c){return c.getAttribute("data-id");});
      d.stops.sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id);});
      save();updateMap();renderRouteIfNeeded();refreshTabsCounts();
    }
    grip.addEventListener("pointerup",end);
    grip.addEventListener("pointercancel",end);
  });
}
function renderRouteIfNeeded(){if(ui.mode==="route")renderBody();}
function refreshTabsCounts(){/* counts unaffected by reorder */}

/* ============================ trip/day ops ============================ */
function addDay(){var t=trip();t.days.push({id:uid(),label:"Day "+(t.days.length+1),notes:"",stops:[]});save();render();}
function deleteDay(i){var t=trip();if(t.days.length<=1)return;
  if(t.days[i].stops.length&&!confirm("Delete this day and its "+t.days[i].stops.length+" stop(s)?"))return;
  t.days.splice(i,1);ui.dayIdx=Math.max(0,Math.min(ui.dayIdx,t.days.length-1));save();render();updateMap();}
function deleteTrip(id){
  var t=state.trips.filter(function(x){return x.id===id;})[0];if(!t)return;
  if(!confirm('Delete the trip "'+t.name+'"? This removes all its days and stops.'))return;
  state.trips=state.trips.filter(function(x){return x.id!==id;});
  if(id===state.activeId){state.activeId=state.trips[0]?state.trips[0].id:null;ui.dayIdx=0;}
  save();render();updateMap();
}
function renderModal(){
  var m=ui.modal;var isNew=m.mode==="new";
  var scrim=el('<div class="scrim"></div>');
  scrim.onclick=function(e){if(e.target===scrim){ui.modal=null;render();}};
  var sheet=el('<div class="sheet"></div>');
  sheet.appendChild(el('<div class="row between" style="margin-bottom:14px"><h2>'+(isNew?"New trip":"Edit trip")+'</h2><button class="iconbtn" id="mx">✕</button></div>'));
  sheet.appendChild(el('<span class="lab">Trip name</span>'));
  var name=el('<input class="field" placeholder="Lisbon 2027">');name.value=m.name||"";sheet.appendChild(name);
  sheet.appendChild(el('<span class="lab">Region for map searches</span>'));
  var region=el('<input class="field" placeholder="Lisbon, Portugal">');region.value=m.region||"";sheet.appendChild(region);
  sheet.appendChild(el('<div style="color:var(--inkSoft);font-size:12px;margin:-2px 0 10px">Added to each stop\u2019s search so photos, pins & directions land in the right city.</div>'));
  var daysVal=m.days||5;
  if(isNew){
    sheet.appendChild(el('<span class="lab">Number of days</span>'));
    var st=el('<div class="stepper"></div>');
    var minus=el('<button>–</button>');var cnt=el('<span style="font-size:20px;font-weight:800;width:32px;text-align:center">'+daysVal+'</span>');var plus=el('<button>+</button>');
    minus.onclick=function(){daysVal=Math.max(1,daysVal-1);cnt.textContent=daysVal;};
    plus.onclick=function(){daysVal=Math.min(30,daysVal+1);cnt.textContent=daysVal;};
    st.appendChild(minus);st.appendChild(cnt);st.appendChild(plus);sheet.appendChild(st);
  }
  var go=el('<button class="save" style="width:100%;padding:13px">'+(isNew?"Create trip":"Save changes")+'</button>');
  go.onclick=function(){
    if(isNew){
      var days=[];for(var i=0;i<daysVal;i++)days.push({id:uid(),label:"Day "+(i+1),notes:"",stops:[]});
      var nt={id:uid(),name:name.value.trim()||"Untitled trip",region:region.value.trim(),days:days};
      state.trips.push(nt);state.activeId=nt.id;ui.dayIdx=0;ui.mode="stops";
    }else{var t=trip();t.name=name.value.trim()||t.name;t.region=region.value.trim();}
    ui.modal=null;save();render();updateMap();
  };
  sheet.appendChild(go);
  scrim.appendChild(sheet);
  setTimeout(function(){var x=document.getElementById("mx");if(x)x.onclick=function(){ui.modal=null;render();};},0);
  return scrim;
}

/* ============================ soft refresh (no full teardown) ============================ */
function softRefresh(){
  // update thumbnails + map-mapped count + map, without disrupting typing/drag
  var t=trip();if(!t)return;
  var d=day();
  document.querySelectorAll(".card").forEach(function(card){
    var s=card._stop;if(!s||!s.img)return;
    var thumb=card.querySelector(".thumb");
    if(thumb&&!thumb.querySelector("img")){
      thumb.classList.remove("loading");
      var img=document.createElement("img");img.src=s.img;img.onerror=function(){this.style.display="none";};thumb.appendChild(img);
    }
  });
  var lab=document.querySelector(".maproute .lab");
  if(lab&&d){var located=d.stops.filter(function(s){return s.lat!=null;}).length;lab.textContent=located+"/"+d.stops.length+" stops mapped";}
  updateMap();
  if(ui.mode==="route")renderBody();
}

/* ============================ boot ============================ */
load();render();updateMap();enrich();
window.addEventListener("resize",function(){if(map)setTimeout(function(){map.invalidateSize();},80);});
</script>

<script>
(function(){
  // service worker (offline) — only works over http(s), not file://
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
  // Android/Chrome install prompt
  var deferred=null;
  var btn=document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault();deferred=e;if(btn)btn.style.display="block";
  });
  if(btn)btn.onclick=function(){
    if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;btn.style.display="none";});
  };
  window.addEventListener("appinstalled",function(){if(btn)btn.style.display="none";});
  // iOS hint (no install API on iOS Safari)
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone=window.navigator.standalone===true || window.matchMedia("(display-mode: standalone)").matches;
  if(isIOS && !standalone){
    try{ if(!localStorage.getItem("iosHintDismissed")){ var h=document.getElementById("iosHint"); if(h){h.style.display="block"; var x=document.getElementById("iosX"); if(x)x.onclick=function(){h.style.display="none";try{localStorage.setItem("iosHintDismissed","1");}catch(e){}};} } }catch(e){}
  }
})();
</script>
