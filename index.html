<style id="leaflet-css">
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}

  .mini .trash{color:var(--danger)}
  .movebar{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .movebar button{background:var(--brassSoft);color:var(--brass);font-family:var(--mono);font-size:12px;font-weight:700;border-radius:8px;padding:6px 10px}

  .catrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .catrow button{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600}
  .field{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px}
  .field.small{font-size:12px;font-family:var(--mono)}
  .addbtn{width:100%;border:1px dashed var(--line);border-radius:14px;padding:12px;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--primary);font-weight:600}
  .save{flex:1;background:var(--primary);color:#fff;font-weight:600;border-radius:10px;padding:9px}
  .cancel{border:1px solid var(--line);border-radius:10px;padding:9px 16px}

  /* route list */
  .leg{position:relative;display:flex;gap:12px;padding-bottom:12px}
  .leg .line{position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
  .leg .num{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;z-index:1}
  .leg .rc{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
  .leg .rc .walk{border:1px solid var(--line);color:var(--primary);font-weight:600;font-size:12px;border-radius:9px;padding:5px 9px;display:inline-flex;align-items:center;gap:5px;margin-top:8px}
  .leg .rhandle{align-self:center;flex:none;color:var(--inkSoft);touch-action:none;cursor:grab;padding:10px 6px;font-size:18px;line-height:1;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .leg.dragging{opacity:.92}
  .leg.dragging .rc{border-color:var(--primary);box-shadow:0 8px 20px rgba(22,32,43,.16)}
  .optwrap{margin-top:8px}
  .opttoggle{width:100%;text-align:left;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:11px 14px;font-weight:700;color:var(--inkSoft);font-size:14px}
  .optlist{margin-top:8px}
  .optcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .optrow{display:flex;align-items:stretch}
  .othumb{flex:none;width:66px;align-self:stretch;min-height:66px;position:relative;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
  .othumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .omeat{flex:1;min-width:0;padding:9px 11px}
  .otitle{font-weight:600;font-size:14px;line-height:1.25}
  .opillrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .otag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px}
  .oblurb{color:var(--inkSoft);font-size:12px;margin-top:4px;line-height:1.3}
  .oacts{display:flex;gap:10px;align-items:center;margin-top:8px}
  .oadd{background:var(--primary);color:#fff;font-weight:700;font-size:12px;border-radius:8px;padding:6px 11px}
  .odir{color:var(--primary);font-weight:600;font-size:12px}
  .pin.opt{background:#fff !important;transform:none;border-radius:50%;width:24px;height:24px;font-size:13px;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  textarea.field{resize:vertical;min-height:64px;font-family:inherit;line-height:1.4}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(22,32,43,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--surface);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0;font-size:18px}
  .lab{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--inkSoft);display:block;margin:2px 0}
  .stepper{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
  .stepper button{border:1px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:22px}
  .empty{text-align:center;color:var(--inkSoft);font-size:14px;padding:34px 10px}
  .leaflet-container{font-family:var(--sans)}
  .pin{background:var(--primary);color:#fff;font-weight:800;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  header .eyebrow{color:#CFECE9}
  header .sub{color:#DDEDEB;opacity:.92}
  header .tripname h1{color:#fff}
  header .tripname span{color:#DDEDEB}
  header .iconbtn{color:#EAF4F2}
  .switch{color:var(--ink)}
  .titlerow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .chev{color:var(--inkSoft);font-size:11px;flex:none;cursor:pointer;padding-left:4px}
  .catpill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:5px}
  .pillrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
  .pillrow .catpill{margin-top:0}
  .bookflag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--brassSoft);color:var(--brass)}
  .bookflag.booked{background:var(--doneTint);color:var(--done)}
  .bookflag.lk{padding:3px 7px}
  .tab .pbar{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
  .tab .pbar span{display:block;height:100%;background:var(--primary);border-radius:2px}
  .tab.active .pbar{background:rgba(255,255,255,.4)}
  .tab.active .pbar span{background:#fff}
  .tdot{margin-left:4px;font-size:10px;vertical-align:middle}
  .card.exp{box-shadow:0 8px 20px rgba(22,32,43,.10)}
  .expander{margin:2px 12px 12px;padding-top:10px;border-top:1px dashed var(--line)}
  .desc{font-size:14px;line-height:1.45;color:var(--ink)}
  .desc.muted{color:var(--inkSoft);font-style:italic}
  .gallery{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .gallery img{height:100px;width:auto;border-radius:10px;flex:none;background:#e6e9eb}
  .more{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#3B4CB8;color:#fff;font-weight:600;font-size:14px;border-radius:10px;padding:9px 13px}
  .pin span{transform:rotate(45deg);font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button id="installBtn" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;background:#0F6E6A;color:#fff;font-weight:600;border-radius:999px;padding:11px 18px;box-shadow:0 6px 18px rgba(22,32,43,.25);font-family:var(--sans)">⬇ Install app</button>
<div id="iosHint" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;max-width:436px;margin:0 auto;background:#16202B;color:#fff;border-radius:12px;padding:12px 14px;font-family:var(--sans);font-size:13px;line-height:1.35">Install: tap the <b>Share</b> icon, then <b>Add to Home Screen</b>. <button id="iosX" style="float:right;color:#9fb0bd;font-weight:700">✕</button></div>

var KEY="trip_itineraries_v1";

  landmark:{label:"Landmark",emoji:"🏛️",color:"#0F6E6A",tint:"#E2F0EE"},

var CAT_KEYS=Object.keys(CATS);

function uid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(36).slice(2);}

  if(/(mall|shopping|palladium|department store)/.test(s))return"shopping";
  if(/(café|cafe|dinner|lunch|lokál|lokal|pivovar|restaurant|market|beer|coffee|savoy|brunch|bar\b)/.test(s))return"food";
  if(/(museum|gallery|galer|mucha|dox|kampa|veletržní|veletrzni|communism|\bart\b)/.test(s))return"art";
  if(/(garden|zahrada|sady|park|petřín|petrin|grébovka|grebovka|hill)/.test(s))return"park";
  if(/(church|bazilika|cathedral|katedrála|synagog|ossuary|monastery|klášter|klaster|rotunda)/.test(s))return"church";
  if(/(tower|věž|\bvez\b|rozhledna|lookout|\bview|dancing house|tančící)/.test(s))return"view";

  return {id:uid(),name:"Prague",region:"Praha, Czechia",
    optionals:[
      mk({t:"Adria Palace (Palác Adria)",n:"Rondo-cubist / Art Deco palace",q:"Palác Adria Praha",c:"landmark",tag:"Art Deco",area:"Old Town"}),

function trip(){for(var i=0;i<state.trips.length;i++)if(state.trips[i].id===state.activeId)return state.trips[i];return null;}
function day(){var t=trip();if(!t)return null;if(ui.dayIdx>t.days.length-1)ui.dayIdx=Math.max(0,t.days.length-1);return t.days[ui.dayIdx];}

/* ============================ maps links ============================ */
function fq(q,region){return (q&&q.indexOf(",")>-1)?q:[q,region].filter(Boolean).join(", ");}
function dirUrl(q,region){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(fq(q,region));}
function legUrl(a,b,region){return "https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+encodeURIComponent(fq(a.query,region))+"&destination="+encodeURIComponent(fq(b.query,region));}
function routeUrl(stops,region){
  var pts=stops.map(function(s){return fq(s.query,region);}).filter(Boolean);
  if(!pts.length)return null;
  if(pts.length===1)return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(pts[0]);
  var origin=pts[0],dest=pts[pts.length-1],way=pts.slice(1,-1);
  var u="https://www.google.com/maps/dir/?api=1&travelmode=walking&origin="+encodeURIComponent(origin)+"&destination="+encodeURIComponent(dest);
  if(way.length)u+="&waypoints="+way.map(encodeURIComponent).join("%7C");
  return u;
}

function googleUrl(s,region){return "https://www.google.com/search?q="+encodeURIComponent((s.title||"")+" "+(region||""));}

/* ============================ enrichment (photos + coords) ============================ */
var geoQueue=[],geoBusy=false;
function enrich(){
  var t=trip();if(!t)return;
  var stops=[];t.days.forEach(function(d){d.stops.forEach(function(s){stops.push(s);});});(t.optionals||[]).forEach(function(s){stops.push(s);});
  stops.forEach(function(s){
    var needDesc=!s.desc&&!s._descLock&&!s._locked;
    var needImg=!s.img&&!s._imgLock&&!s._locked;
    if(s._wikiTried||(!needDesc&&!needImg)){ if(needImg&&!s.img)commonsImg(s); if(s.lat==null)maybeGeo(s); return; }
    if(!s.wiki){ s._wikiTried=true; if(needImg)commonsImg(s); if(s.lat==null)maybeGeo(s); return; }
    var base="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|coordinates|extracts&piprop=thumbnail&pithumbsize=600&exsentences=3&explaintext=1&";
    var url=base+(s.wikiExact?("titles="+encodeURIComponent(s.wiki)):("generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(s.wiki)));
    fetch(url).then(function(r){return r.json();}).then(function(j){
      s._wikiTried=true;
      var pages=j&&j.query&&j.query.pages;var changed=false;var gotImg=false;
      if(pages){var p=pages[Object.keys(pages)[0]];
        if(p){
          if(p.thumbnail&&p.thumbnail.source&&needImg){s.img=p.thumbnail.source;changed=true;gotImg=true;}
          if(p.coordinates&&p.coordinates[0]&&s.lat==null){s.lat=p.coordinates[0].lat;s.lng=p.coordinates[0].lon;changed=true;}
          if(p.extract&&needDesc){s.desc=p.extract;changed=true;}
          if(p.title&&!s.wikiTitle){s.wikiTitle=p.title;changed=true;}
        }
      }
      if(changed){save();softRefresh();}
      if(needImg&&!gotImg&&!s.img)commonsImg(s);
      if(s.lat==null)maybeGeo(s);
    }).catch(function(){ if(needImg&&!s.img)commonsImg(s); maybeGeo(s); });
  });
}
function commonsImg(s){
  if(s._commonsTried||s.img||s._imgLock||s._locked)return; s._commonsTried=true;
  var t=trip();var q=s.commonsQ||s.wiki||fq(s.query,t?t.region:"")||s.title;
  var url="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=1&gsrsearch="+encodeURIComponent(q)+"&prop=imageinfo&iiprop=url&iiurlwidth=600";
  fetch(url).then(function(r){return r.json();}).then(function(j){
    var pages=j&&j.query&&j.query.pages;if(!pages)return;
    var p=pages[Object.keys(pages)[0]];
    if(p&&p.imageinfo&&p.imageinfo[0]&&p.imageinfo[0].thumburl){s.img=p.imageinfo[0].thumburl;save();softRefresh();}
  }).catch(function(){});
}
function maybeGeo(s){
  if(s.lat!=null||s._geoTried)return;s._geoTried=true;
  geoQueue.push(s);pumpGeo();
}
function pumpGeo(){
  if(geoBusy||!geoQueue.length)return;geoBusy=true;
  var s=geoQueue.shift();var t=trip();var q=fq(s.query,t?t.region:"");
  var url="https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q);
  fetch(url,{headers:{Accept:"application/json"}}).then(function(r){return r.json();}).then(function(j){
    if(j&&j[0]){s.lat=parseFloat(j[0].lat);s.lng=parseFloat(j[0].lon);save();softRefresh();}
  }).catch(function(){}).then(function(){
    setTimeout(function(){geoBusy=false;pumpGeo();},1100);
  });
}
function fetchGallery(s,cb){
  if(s._galTried||!s.wikiTitle){if(cb)cb();return;}
  s._galTried=true;
  fetch("https://en.wikipedia.org/api/rest_v1/page/media-list/"+encodeURIComponent(s.wikiTitle))
    .then(function(r){return r.json();}).then(function(j){
      var out=[],seen={};
      (j.items||[]).forEach(function(it){
        if(it.type==="image"&&it.srcset&&it.srcset[0]&&it.srcset[0].src){
          var u=it.srcset[0].src; if(u.indexOf("//")===0)u="https:"+u;
          if(!/\.svg/i.test(u)&&!seen[u]){seen[u]=1;out.push(u);}
        }
      });
      s.gallery=out.slice(0,6); save(); if(cb)cb();
    }).catch(function(){ if(cb)cb(); });
}

/* ============================ Leaflet map ============================ */
var map=null,markerLayer=null,tilesOk=false,markerById={};
function ensureMap(){
  if(map)return;
  try{
    map=L.map("map",{zoomControl:true,attributionControl:true,scrollWheelZoom:false});
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
    tilesOk=true;markerLayer=L.layerGroup().addTo(map);
    map.setView([50.087,14.42],12);
  }catch(e){map=null;}
}
function updateMap(skipFit){
  if(!window.L){
    var mm=document.getElementById("map");
    if(mm)mm.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:16px;text-align:center;color:#5A6774;font-size:13px">Map couldn\u2019t load (need a connection the first time). The list & directions still work.</div>';
    return;
  }
  ensureMap();if(!map)return;
  markerLayer.clearLayers();markerById={};
  var d=day();if(!d){return;}
  var t=trip();
  var pts=[],latlngs=[];
  d.stops.forEach(function(s,i){
    if(s.lat==null||s.lng==null)return;
    var ll=[s.lat,s.lng];latlngs.push(ll);pts.push(ll);
    var num=i+1;
    var cat=CATS[s.cat]||CATS.landmark;
    var pcol=s.done?"#9AA6AE":cat.color;var plbl=s.done?"\u2713":String(num);
    var icon=L.divIcon({className:"",html:'<div class="pin" style="background:'+pcol+'"><span>'+plbl+'</span></div>',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]});
    var m=L.marker(ll,{icon:icon,opacity:s.done?0.55:1}).addTo(markerLayer);
    markerById[s.id]=m;
    var pop='<b>'+num+". "+escapeHtml(s.title)+'</b><br><a href="'+dirUrl(s.query,t.region)+'" target="_blank" rel="noopener">Directions ↗</a>';
    m.bindPopup(pop);
    (function(sid){m.on("click",function(){highlightStop(sid);});})(s.id);
  });
  if(latlngs.length>1){L.polyline(latlngs,{color:"#0F6E6A",weight:3,opacity:.7,dashArray:"1 8",lineCap:"round"}).addTo(markerLayer);}
  if(ui.optOpen&&ui.optOpen[d.id]){
    optionalsForDay(d).forEach(function(o){
      if(o.lat==null||o.lng==null)return;
      var oc=CATS[o.cat]||CATS.landmark;
      var oi=L.divIcon({className:"",html:'<div class="pin opt" style="border-color:'+oc.color+'">'+oc.emoji+'</div>',iconSize:[24,24],iconAnchor:[12,24],popupAnchor:[0,-22]});
      L.marker([o.lat,o.lng],{icon:oi}).addTo(markerLayer).bindPopup('<b>'+escapeHtml(o.title)+'</b>'+(o.tag?'<br><i>'+escapeHtml(o.tag)+'</i>':''));
    });
  }
  if(pts.length && !skipFit){try{map.fitBounds(L.latLngBounds(pts).pad(0.25),{maxZoom:15});}catch(e){}}
  setTimeout(function(){try{map.invalidateSize();}catch(e){}},60);
}

/* list <-> map linking */
function focusStopOnMap(s){
  if(s.lat==null||s.lng==null||!map){ if(ui.expanded[s.id])delete ui.expanded[s.id]; else ui.expanded[s.id]=true; refreshStops(); return; }
  var mapEl=document.getElementById("map");if(mapEl)mapEl.scrollIntoView({behavior:"smooth",block:"start"});
  try{map.setView([s.lat,s.lng],Math.max(map.getZoom(),15),{animate:true});}catch(e){}
  var m=markerById[s.id];if(m){try{m.openPopup();}catch(e){}}
}
function highlightStop(id){

    var card=document.querySelector('.card[data-id="'+id+'"]');
    if(card){card.scrollIntoView({behavior:"smooth",block:"center"});card.classList.add("flash");setTimeout(function(){card.classList.remove("flash");},1300);}
  },needRender?70:0);
}
function refreshTabs(){var t=trip();if(!t)return;var old=document.querySelector(".tabs");if(old&&old.parentNode){old.parentNode.replaceChild(renderTabs(t),old);}}

/* ============================ rendering ============================ */
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(html){var d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}

function render(){
  var app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(renderHeader());
  var t=trip();
  if(!t){app.appendChild(el('<div class="empty" style="padding-top:60px">No trips yet.<br><br></div>'));
    var b=el('<button class="btn-primary" style="margin:0 auto">+ Create a trip</button>');
    b.onclick=function(){ui.modal={mode:"new",name:"",region:"",days:5};render();};

  app.appendChild(renderTabs(t));

function renderHeader(){
  var t=trip();

  if(t)t.days.forEach(function(d){d.stops.forEach(function(s){total++;if(s.done)done++;});});
  var h=el('<header></header>');
  var top=el('<div class="row between" style="align-items:flex-start"></div>');
  var left=el('<div style="min-width:0"><div class="eyebrow">Itinerary</div></div>');
  var nameBtn=el('<button class="tripname"><h1>'+escapeHtml(t?t.name:"No trip")+'</h1><span style="color:var(--inkSoft)">▾</span></button>');
  nameBtn.onclick=function(){ui.switcher=!ui.switcher;render();};
  left.appendChild(nameBtn);
  if(t)left.appendChild(el('<div class="sub">'+t.days.length+' days · '+done+'/'+total+' done</div>'));
  top.appendChild(left);
  if(t){var edit=el('<button class="iconbtn" aria-label="Edit trip">✎</button>');
    edit.onclick=function(){ui.modal={mode:"edit",name:t.name,region:t.region};render();};top.appendChild(edit);}
  h.appendChild(top);
  if(ui.switcher)h.appendChild(renderSwitcher());

function renderSwitcher(){
  var box=el('<div class="switch"></div>');

    var item=el('<div class="item"'+(t.id===state.activeId?' style="background:var(--primarySoft)"':'')+'></div>');
    var pick=el('<button class="pick"><div class="n">'+escapeHtml(t.name)+'</div><div class="mono" style="font-size:12px;color:var(--inkSoft)">'+t.days.length+' days</div></button>');
    pick.onclick=function(){state.activeId=t.id;ui.dayIdx=0;ui.mode="stops";ui.switcher=false;save();render();updateMap();enrich();};
    var del=el('<button style="padding:12px;color:var(--danger)">🗑</button>');

    item.appendChild(pick);item.appendChild(del);box.appendChild(item);
  });
  var nw=el('<button class="new">＋ New trip</button>');

}
function renderTabs(t){
  var tabs=el('<div class="tabs"></div>');var inner=el('<div class="inner"></div>');
  tabs.addEventListener("scroll",function(){ui.tabScroll=tabs.scrollLeft;});
  t.days.forEach(function(d,i){
    var dn=d.stops.filter(function(s){return s.done;}).length;
    var tot=d.stops.length;var pct=tot?Math.round(dn/tot*100):0;
    var toBook=d.stops.some(function(s){return s.book&&!s.booked;});
    var dot=toBook?' <span class="tdot">\ud83c\udf9f</span>':'';
    var tab=el('<button class="tab'+(i===ui.dayIdx?' active':'')+'"><div class="lbl">'+escapeHtml(d.label)+dot+'</div><div class="cnt">'+dn+'/'+tot+'</div><div class="pbar"><span style="width:'+pct+'%"></span></div></button>');
    tab.onclick=function(){ui.dayIdx=i;save();render();updateMap();};
    inner.appendChild(tab);
  });
  var add=el('<button class="tab add">＋</button>');
  add.onclick=function(){addDay();};inner.appendChild(add);
  tabs.appendChild(inner);
  requestAnimationFrame(function(){try{tabs.scrollLeft=ui.tabScroll||0;}catch(e){}});
  return tabs;
}
function renderDayHead(){

function renderBody(){

/* ---- optional destinations (area-matched pool) ---- */

function renderOptionalCard(o,d,t){

function promoteOptional(o,d){

function renderExpander(s,t){
  var wrap=el('<div class="expander"></div>');
  if(s.desc)wrap.appendChild(el('<div class="desc">'+escapeHtml(s.desc)+'</div>'));
  else wrap.appendChild(el('<div class="desc muted">No description saved yet \u2014 open this once while online and it\u2019ll be here offline afterward.</div>'));
  var imgs=(s.gallery&&s.gallery.length)?s.gallery:(s.img?[s.img]:[]);

function renderRoute(){
  var d=day();var t=trip();
  var wrap=el('<div></div>');
  if(!d.stops.length){wrap.appendChild(el('<div class="empty">Add stops to build a route.</div>'));return wrap;}
  d.stops.forEach(function(s,i){
    var cat=CATS[s.cat]||CATS.landmark;

    if(i<d.stops.length-1)leg.appendChild(el('<div class="line"></div>'));
    leg.appendChild(el('<div class="num" style="background:'+(s.done?"#9AA6AE":cat.color)+'">'+(s.done?"\u2713":(i+1))+'</div>'));
    var rc=el('<div class="rc"></div>');
    rc.appendChild(el('<div class="title" style="'+(s.done?"text-decoration:line-through;color:var(--inkSoft)":"")+'">'+escapeHtml(s.title)+'</div>'));

    var dh=el('<a class="walk" style="border-color:transparent" target="_blank" rel="noopener">➤ Directions here</a>');dh.href=dirUrl(s.query,t.region);acts.appendChild(dh);

function enableRouteDrag(wrap,d){
  wrap.querySelectorAll(".rhandle").forEach(function(handle){
    var leg=handle.parentNode;if(!leg)return;
    handle.addEventListener("pointerdown",function(e){
      e.preventDefault();if(e.button&&e.button!==0)return;
      leg.classList.add("dragging");
      try{handle.setPointerCapture(e.pointerId);}catch(_){}
      function move(ev){
        ev.preventDefault();
        var y=ev.clientY;
        var legs=Array.prototype.slice.call(wrap.querySelectorAll(".leg"));
        var after=null;
        for(var i=0;i<legs.length;i++){if(legs[i]===leg)continue;var r=legs[i].getBoundingClientRect();if(y<r.top+r.height/2){after=legs[i];break;}}
        if(after)wrap.insertBefore(leg,after);else wrap.appendChild(leg);
      }
      function up(){
        leg.classList.remove("dragging");
        document.removeEventListener("pointermove",move,true);
        document.removeEventListener("pointerup",up,true);
        document.removeEventListener("pointercancel",up,true);
        var ids=Array.prototype.slice.call(wrap.querySelectorAll(".leg")).map(function(l){return l.getAttribute("data-id");});
        d.stops.sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id);});
        save();renderBody();
      }
      document.addEventListener("pointermove",move,true);
      document.addEventListener("pointerup",up,true);
      document.addEventListener("pointercancel",up,true);
    });
  });
}

/* ============================ drag reorder ============================ */
function enableDrag(list,d){
  list.querySelectorAll(".card").forEach(function(card){
    var handle=card._thumb;if(!handle)return;
    handle.addEventListener("pointerdown",function(e){
      if(e.target&&e.target.closest&&e.target.closest(".check"))return;
      if(e.button&&e.button!==0)return;
      var startY=e.clientY,dragging=false,pid=e.pointerId;
      function begin(){
        dragging=true;card._dragged=true;card.classList.add("dragging");
        list.style.touchAction="none";
        try{handle.setPointerCapture(pid);}catch(_){}
      }
      var holdTimer=setTimeout(begin,170);
      function move(ev){
        if(!dragging){ if(Math.abs(ev.clientY-startY)>10){clearTimeout(holdTimer);cleanup();} return; }
        ev.preventDefault();
        var y=ev.clientY;
        var cards=Array.prototype.slice.call(list.querySelectorAll(".card"));
        var after=null;
        for(var i=0;i<cards.length;i++){
          if(cards[i]===card)continue;
          var r=cards[i].getBoundingClientRect();
          if(y<r.top+r.height/2){after=cards[i];break;}
        }
        if(after)list.insertBefore(card,after);else list.appendChild(card);
      }
      function up(){
        clearTimeout(holdTimer);
        if(dragging){
          card.classList.remove("dragging");list.style.touchAction="";
          var ids=Array.prototype.slice.call(list.querySelectorAll(".card")).map(function(c){return c.getAttribute("data-id");});
          d.stops.sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id);});
          save();updateMap(true);
          setTimeout(function(){card._dragged=false;},60);
        }
        cleanup();
      }
      function cleanup(){
        document.removeEventListener("pointermove",move,true);
        document.removeEventListener("pointerup",up,true);
        document.removeEventListener("pointercancel",up,true);
      }
      document.addEventListener("pointermove",move,true);
      document.addEventListener("pointerup",up,true);
      document.addEventListener("pointercancel",up,true);
    });
  });
}

function updateCounts(){
  var t=trip();if(!t)return;
  var done=0,total=0;t.days.forEach(function(d){d.stops.forEach(function(s){total++;if(s.done)done++;});});
  var sub=document.querySelector("header .sub");if(sub)sub.textContent=t.days.length+" days · "+done+"/"+total+" done";
  var tabs=document.querySelectorAll(".tabs .tab");var d=day();
  if(tabs[ui.dayIdx]){var cnt=tabs[ui.dayIdx].querySelector(".cnt");if(cnt&&d)cnt.textContent=d.stops.filter(function(s){return s.done;}).length+"/"+d.stops.length;}
}

/* ============================ trip/day ops ============================ */
function addDay(){var t=trip();t.days.push({id:uid(),label:"Day "+(t.days.length+1),notes:"",stops:[]});save();render();}
function deleteDay(i){var t=trip();if(t.days.length<=1)return;
  if(t.days[i].stops.length&&!confirm("Delete this day and its "+t.days[i].stops.length+" stop(s)?"))return;
  t.days.splice(i,1);ui.dayIdx=Math.max(0,Math.min(ui.dayIdx,t.days.length-1));save();render();updateMap();}
function deleteTrip(id){
  var t=state.trips.filter(function(x){return x.id===id;})[0];if(!t)return;
  if(!confirm('Delete the trip "'+t.name+'"? This removes all its days and stops.'))return;
  state.trips=state.trips.filter(function(x){return x.id!==id;});
  if(id===state.activeId){state.activeId=state.trips[0]?state.trips[0].id:null;ui.dayIdx=0;}
  save();render();updateMap();
}
function renderModal(){
  var m=ui.modal;var isNew=m.mode==="new";

  sheet.appendChild(el('<span class="lab">Region for map searches</span>'));

  if(isNew){
    sheet.appendChild(el('<span class="lab">Number of days</span>'));
    var st=el('<div class="stepper"></div>');

    minus.onclick=function(){daysVal=Math.max(1,daysVal-1);cnt.textContent=daysVal;};

    st.appendChild(minus);st.appendChild(cnt);st.appendChild(plus);sheet.appendChild(st);
  }

    }else{var t=trip();t.name=name.value.trim()||t.name;t.region=region.value.trim();}

  return scrim;
}

/* ============================ soft refresh (no full teardown) ============================ */
function softRefresh(){
  // update thumbnails + map-mapped count + map, without disrupting typing/drag
  var t=trip();if(!t)return;
  var d=day();
  document.querySelectorAll(".card").forEach(function(card){
    var s=card._stop;if(!s||!s.img)return;
    var thumb=card.querySelector(".thumb");
    if(thumb&&!thumb.querySelector("img")){
      thumb.classList.remove("loading");
      var img=document.createElement("img");img.src=s.img;img.draggable=false;img.onerror=function(){this.style.display="none";};thumb.appendChild(img);
    }
  });
  var lab=document.querySelector(".maproute .lab");
  if(lab&&d){var located=d.stops.filter(function(s){return s.lat!=null;}).length;lab.textContent=located+"/"+d.stops.length+" stops mapped";}
  if(ui.expanded&&Object.keys(ui.expanded).length)refreshStops();
  updateMap();
}
